# ==============================================================================
# Coturn STUN/TURN Server Production Hardened Configuration
# Zoom/Teams Clone Platform (MeetSphere)
# ==============================================================================

# ------------------------------------------------------------------------------
# Listening Ports & Protocols
# ------------------------------------------------------------------------------
# Standard STUN/TURN UDP & TCP listening port
listening-port=3478
# Secure TURNS TLS & DTLS listening port
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 binds to all available host network interfaces)
listening-ip=0.0.0.0

# Relay IP address for outgoing traffic allocations
relay-ip=0.0.0.0

# ------------------------------------------------------------------------------
# Dynamic HMAC-SHA1 Secret Authentication (coturn REST API Spec)
# ------------------------------------------------------------------------------
# Enable long-term credential mechanism for WebRTC clients
lt-cred-mech

# Use dynamic time-limited credentials generated via static shared secret
use-auth-secret

# Static secret shared between Node.js backend & coturn server for HMAC-SHA1 signature validation
# Must match TURN_STATIC_AUTH_SECRET in server environment variables
static-auth-secret=meetsphere-turn-static-auth-secret-2026-key

# Realm used for credential validation
realm=turn.meetsphere.com

# User database (disables SQLite local user DB requirement when using auth secret)
userdb=/var/lib/turn/turndb

# ------------------------------------------------------------------------------
# Security Hardening & Protocol Constraints
# ------------------------------------------------------------------------------
# Include fingerprint attribute in TURN messages (mandatory for WebRTC RFC 5766 compliance)
fingerprint

# Prevent clients from selecting standard stdout/stderr/system ports as allocation destinations
no-stdout-port

# Disable relaying media to multicast peer addresses to prevent IP spoofing & amplification attacks
no-multicast-peers

# Disable legacy TLS 1.0 & TLS 1.1 - enforce modern TLS 1.2 and TLS 1.3 only
no-tlsv1
no-tlsv1.1

# Disable Coturn CLI admin interface for zero attack surface
no-cli

# Restrict relay allocations to RFC 1918 private IPv4 networks (anti-SSRF / internal network protection)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

# ------------------------------------------------------------------------------
# Media Relay UDP Port Allocation Range
# ------------------------------------------------------------------------------
# Ephemeral UDP port allocation range for WebRTC media streams (50,000+ potential concurrent sessions)
min-port=49152
max-port=65535

# Maximum session allocation count per user
user-quota=100
total-quota=10000

# ------------------------------------------------------------------------------
# TLS / DTLS Encryption Certificates (Let's Encrypt path)
# ------------------------------------------------------------------------------
cert=/etc/letsencrypt/live/turn.meetsphere.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.meetsphere.com/privkey.pem

# TLS Cipher suite optimization for high-performance security
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"

# ------------------------------------------------------------------------------
# NAT / External Public IP Mapping (Uncomment & set for AWS/GCP/Azure deployments behind NAT)
# ------------------------------------------------------------------------------
# external-ip=PUBLIC_IPV4_ADDRESS
# external-ip=PUBLIC_IPV4_ADDRESS/PRIVATE_IPV4_ADDRESS

# ------------------------------------------------------------------------------
# Logging & Process Control
# ------------------------------------------------------------------------------
# Output log messages to stdout for Docker container log collection
log-file=stdout
simple-log
