version: '3.8'

services:
  # Service 1: MongoDB Database with volume persistence and healthchecks
  mongodb:
    image: mongo:6.0
    container_name: meetsphere-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - meetsphere-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Service 2: Redis Cache with persistence enabled
  redis:
    image: redis:7-alpine
    container_name: meetsphere-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - meetsphere-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Service 3: LiveKit Media Server connected to Redis with restricted UDP port range
  livekit:
    image: livekit/livekit-server:latest
    container_name: meetsphere-livekit
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1", "--keys", "devkey: secretkey", "--redis-host", "redis:6379"]
    environment:
      - "LIVEKIT_KEYS=devkey: secretkey"
      - "LIVEKIT_REDIS_ADDRESS=redis:6379"
      - "LIVEKIT_RTC_PORT_RANGE_START=50000"
      - "LIVEKIT_RTC_PORT_RANGE_END=50010"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50010:50000-50010/udp"
    networks:
      - meetsphere-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Service 4: Express Node.js Backend API & WebSocket Signaling Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meetsphere-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - LOG_LEVEL=info
      - MONGODB_URI=mongodb://mongodb:27017/nexus_workspace
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_API_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secretkey
      - LIVEKIT_TOKEN_TTL=4h
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=dev-jwt-secret-key-meetsphere-2026
      - JWT_EXPIRES_IN=7d
      - TURN_STATIC_AUTH_SECRET=meetsphere-turn-static-auth-secret-2026-key
      - TURN_DOMAIN=turn.meetsphere.com
      - TURN_REALM=turn.meetsphere.com
      - TURN_PORT=3478
      - TURN_TLS_PORT=5349
      - TURN_TTL=86400
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - meetsphere-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Service 5: Vite React Frontend Client
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: meetsphere-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_LIVEKIT_URL=ws://localhost:7880
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - meetsphere-net
    depends_on:
      backend:
        condition: service_healthy
  # Service 6: Coturn High-Performance STUN/TURN Server
  coturn:
    build:
      context: ./coturn
      dockerfile: Dockerfile.coturn
    container_name: meetsphere-coturn
    restart: always
    # Host networking mode provides direct host interface socket access for raw UDP media relay performance.
    # Note for macOS/Windows Docker Desktop local testing: Host network mode is native to Linux.
    network_mode: "host"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - TURN_STATIC_AUTH_SECRET=meetsphere-turn-static-auth-secret-2026-key
      - TURN_REALM=turn.meetsphere.com
    healthcheck:
      test: ["CMD-SHELL", "turnadmin -l || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  meetsphere-net:
    driver: bridge

